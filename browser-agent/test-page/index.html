<!DOCTYPE html>
<html>

<head>
    <title>Agent Form Test</title>
</head>

<body>

<h1>Browser Agent Test</h1>

<form onsubmit="submitted(event)">

    <label>
        Name:
        <input
            type="text"
            name="name"
            placeholder="Enter your name"
        >
    </label>

    <br><br>

    <label>
        Email:
        <input
            type="email"
            name="email"
            placeholder="Enter your email"
        >
    </label>

    <br><br>

    <label>
        Phone:
        <input
            type="tel"
            name="phone"
            placeholder="Enter your phone"
        >
    </label>

    <br><br>

    <button type="submit">
        Submit
    </button>

</form>

<h2 id="result"></h2>

<script>

function submitted(event) {

    event.preventDefault();

    document.getElementById("result").innerText =
        "FORM SUBMITTED SUCCESSFULLY";

}

</script>

</body>

</html>
