<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Privacy Vision Agent — Debug</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; font-size: 13px; }
      button { padding: 6px 12px; margin-right: 8px; }
      textarea, pre { width: 100%; box-sizing: border-box; height: 260px; font-family: monospace; font-size: 12px; }
      .row { margin: 10px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      input { padding: 4px 6px; }
      #elements { white-space: pre-wrap; overflow: auto; border: 1px solid #ccc; padding: 8px; }
    </style>
  </head>
  <body>
    <h2>Privacy Vision Agent — Debug Console</h2>
    <div class="row">
      <button id="extract-btn">Extract State</button>
      <span id="active-tab"></span>
    </div>
    <div id="elements">(no state yet)</div>

    <h3>Execute Action</h3>
    <div class="row">
      <label>action <select id="action-type"><option>click</option><option>type</option><option>scroll</option><option>done</option></select></label>
      <label>target_id <input id="target-id" type="number" style="width:60px" /></label>
      <label>value <input id="action-value" type="text" /></label>
      <button id="execute-btn">Execute</button>
    </div>
    <pre id="exec-result">(no action executed yet)</pre>

    <h3>Run Agent (Phase 2+)</h3>
    <div class="row">
      <input id="task-input" type="text" style="flex:1" placeholder="e.g. fill this form with test data and submit" />
      <button id="run-task-btn">Run Agent</button>
    </div>
    <pre id="task-result">(agent not run yet)</pre>

    <script src="debug.js"></script>
  </body>
</html>
